name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

# id-token:write — OIDC token for keyless Azure login.
# contents:read  — checkout only, no GitHub Releases needed.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    env:
      APP_NAME: azure-retirement-navigator
      RESOURCE_GROUP: azure-retirement-navigator-rg

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── Build deployment zip ───────────────────────────────────────────────
      # Source-only zip — Oryx installs packages server-side during deploy
      # (SCM_DO_BUILD_DURING_DEPLOYMENT=true set in Terraform app_settings).
      - name: Create deployment zip
        run: |
          zip -r app.zip . \
            --exclude "infra/*" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.zip" \
            --exclude ".venv/*" \
            --exclude "venv/*" \
            --exclude ".python_packages/*"
          echo "Package size: $(du -sh app.zip | cut -f1)"

      # ── Deploy ─────────────────────────────────────────────────────────────
      # az webapp deploy triggers an Oryx build (pip install), then restarts.
      - name: Deploy to App Service
        run: |
          az webapp deploy \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --src-path app.zip \
            --type zip

      # ── Smoke test ──────────────────────────────────────────────────────────
      - name: Smoke test health endpoint
        run: |
          sleep 60
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://${APP_NAME}.azurewebsites.net/api/health")
          echo "Health: $STATUS"
          if [[ "$STATUS" != "200" ]]; then
            echo "Health check failed with HTTP $STATUS"
            exit 1
          fi
