name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

# id-token:write — OIDC token for keyless Azure login.
# contents:read  — checkout only, no GitHub Releases needed.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    env:
      APP_NAME: azure-retirement-navigator
      RESOURCE_GROUP: azure-retirement-navigator-rg

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── Build deployment zip ───────────────────────────────────────────────
      # Source-only zip — Oryx installs packages server-side during deploy
      # (SCM_DO_BUILD_DURING_DEPLOYMENT=true set in Terraform app_settings).
      - name: Create deployment zip
        run: |
          zip -r app.zip . \
            --exclude "infra/*" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.zip" \
            --exclude ".venv/*" \
            --exclude "venv/*" \
            --exclude ".python_packages/*"
          echo "Package size: $(du -sh app.zip | cut -f1)"

      # ── Deploy ─────────────────────────────────────────────────────────────
      # --async true: fire-and-forget. Oryx build + startup takes ~4-5 min
      # which exceeds az webapp deploy's 10-min startup wait; the smoke test
      # below handles readiness polling instead.
      - name: Deploy to App Service
        run: |
          az webapp deploy \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --src-path app.zip \
            --type zip \
            --async true

      # ── Smoke test ──────────────────────────────────────────────────────────
      # Retry every 30 s for up to 10 min (20 attempts) — accounts for the
      # ~3-min Oryx pip-install + container restart time.
      - name: Smoke test health endpoint
        run: |
          echo "Polling health endpoint (Oryx build + startup takes ~4 min)..."
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://${APP_NAME}.azurewebsites.net/api/health" 2>/dev/null || echo "000")
            echo "Attempt $i/20: HTTP $STATUS"
            if [[ "$STATUS" == "200" ]]; then
              echo "Health check passed"
              exit 0
            fi
            sleep 30
          done
          echo "Health check failed after 10 minutes"
          exit 1
